[package]
name = "designdb"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "designdb"

[dependencies]
chrono = "0.4.45"
flate2 = "1.1.9"
libc = "0.2"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.2", features = ["v4"] }
safer-ffi = "0.1.13"
polodb_core = "5.3"
